name: release

# main に push されたとき、辞書の生成に関わるファイルが変わっていれば
# 辞書をビルドし、検査して、GitHub Release として公開する。
# README などの文書だけを変更した push では起動しない。
# タグは build 日付と実行番号から自動で付ける（例: v2026.10.19-12）。

on:
  push:
    branches: [main]
    paths:
      - build.py
      - romaji.py
      - data/**
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

# 続けて push されても、リリースが同時に走らないようにする。
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # 手動実行でも main 以外からは公開しない
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 辞書をビルド
        run: |
          set -euo pipefail
          python build.py --out dist | tee build.log

      - name: 単語ファイルを検査
        run: python tools/verify_dist.py dist

      - name: 配布物をまとめる
        run: |
          set -euo pipefail
          mkdir -p assets
          # ATOK にそのまま取り込める 4 つの辞書
          cp dist/atok-emoji.txt  assets/
          cp dist/atok-math.txt   assets/
          cp dist/atok-accent.txt assets/
          cp dist/atok-all.txt    assets/
          # ライセンスと第三者の表示
          cp LICENSE              assets/LICENSE.txt
          cp THIRD_PARTY_NOTICES.md assets/
          ls -l assets

      - name: タグ名を決める
        id: tag
        run: |
          set -euo pipefail
          echo "name=v$(date -u +%Y.%m.%d)-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: リリースノートを作る
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          subject="$(git log -1 --pretty=%s)"
          {
            echo "ATOK 用 Unicode 辞書 ${TAG}"
            echo
            echo "COMMIT: ${GITHUB_SHA:0:7}"
            echo
            echo "## 配布する Unicode 辞書"
            echo
            echo '| ファイル | 内容 |'
            echo '|---|---|'
            echo '| `atok-emoji.txt` | 絵文字 |'
            echo '| `atok-math.txt` | 数学記号・技術記号・ギリシャ文字・各書体・関数名 |'
            echo '| `atok-accent.txt` | アクセント付きラテン文字 |'
            echo '| `atok-all.txt` | 上の 3 つをすべて含む |'
            echo '| `LICENSE.txt` / `THIRD_PARTY_NOTICES.md` | ライセンスと第三者データの表示 |'
            echo
            echo '`atok-all.txt` には他の 3 つのすべての語が含まれています。'
            echo
            echo "## 収録語数"
            echo
            echo '```'
            head -4 build.log
            echo '```'
            echo
            echo "## ATOK ユーザ辞書への登録方法"
            echo
            echo '1. 辞書ユーティリティの[ファイル]→[新規作成]で専用の辞書を作る。'
            echo '2. その辞書の[ツール]→[ファイルから登録・削除]で、単語ファイルを登録する。'
            echo '3. ATOK プロパティ →[辞書・学習]で、標準辞書セットにその辞書を追加する。'
            echo
            echo 'すべての読みは `:Infty` `:B` `:E` `:わらう` のようにコロンで始めます。'
            echo '大文字始まりの英字読みを使うため、ATOK プロパティ →[入力・変換]→[英語]の「英語入力ではスペースバーで空白を入力する」をオフにしてください。'
            echo "詳しくは [README](https://github.com/${GITHUB_REPOSITORY}#readme) を参照してください。"
            echo
            echo "## ライセンス"
            echo
            echo 'MIT License'
            echo
            echo '絵文字の読みは Mozc (BSD 3-Clause)、TeX のコマンド名の対応表は Julia (MIT)と unicode-math (LPPL 1.3c) に由来します。詳しくは `THIRD_PARTY_NOTICES.md` を参照してください。'
          } > release-notes.md
          cat release-notes.md

      - name: リリースを公開
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            # 同じ実行の再試行で、すでにリリースがある場合は上書きする
            gh release upload "$TAG" assets/* --clobber
            gh release edit "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" assets/* \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --notes-file release-notes.md \
              --latest
          fi
